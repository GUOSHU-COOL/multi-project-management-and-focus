<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2d49"/>
      <stop offset="1" stop-color="#123e5b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#061a2b" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1400" height="820" rx="28" fill="url(#bg)"/>
  <text x="70" y="78" fill="#58b9f5" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="22" font-weight="700" letter-spacing="4">FOCUS BOARD</text>
  <text x="70" y="130" fill="#f4f8fb" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="38" font-weight="700">跨项目四象限</text>
  <text x="70" y="168" fill="#a9c3d2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="20">把所有项目放到同一张地图上，决定现在该关注什么</text>
  <rect x="70" y="215" width="1260" height="500" rx="22" fill="#102f47" stroke="#4e91b6" stroke-width="2" filter="url(#shadow)"/>
  <line x1="700" y1="245" x2="700" y2="685" stroke="#4e91b6" stroke-width="2"/>
  <line x1="100" y1="465" x2="1300" y2="465" stroke="#4e91b6" stroke-width="2"/>
  <text x="120" y="270" fill="#7bd0ff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="20" font-weight="700">重要且紧急 · 现在处理</text>
  <text x="730" y="270" fill="#7bd0ff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="20" font-weight="700">重要不紧急 · 留出时间</text>
  <text x="120" y="510" fill="#7bd0ff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="20" font-weight="700">不重要但紧急 · 尽快简化</text>
  <text x="730" y="510" fill="#7bd0ff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="20" font-weight="700">不重要不紧急 · 稍后再看</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="18">
    <g fill="#194d6d" stroke="#62b9e8">
      <rect x="120" y="300" width="500" height="70" rx="14"/><rect x="120" y="385" width="500" height="55" rx="14"/>
      <rect x="730" y="300" width="500" height="70" rx="14"/><rect x="730" y="385" width="500" height="55" rx="14"/>
      <rect x="120" y="540" width="500" height="70" rx="14"/><rect x="730" y="540" width="500" height="70" rx="14"/>
    </g>
    <g fill="#f4f8fb">
      <text x="145" y="330">研究项目 · 整理实验假设</text><text x="145" y="415">产品项目 · 修复登录流程</text>
      <text x="755" y="330">课程项目 · 完成章节大纲</text><text x="755" y="415">写作项目 · 每周更新一节</text>
      <text x="145" y="570">团队项目 · 回复协作消息</text><text x="755" y="570">生活项目 · 整理照片文件</text>
    </g>
    <g fill="#8fd8ff" font-size="15">
      <text x="145" y="354">研究项目 · 45 分钟</text><text x="145" y="433">产品项目 · 25 分钟</text>
      <text x="755" y="354">课程项目 · 30 分钟</text><text x="755" y="433">写作项目 · 20 分钟</text>
      <text x="145" y="594">团队项目 · 15 分钟</text><text x="755" y="594">生活项目 · 10 分钟</text>
    </g>
  </g>
  <text x="70" y="770" fill="#8fb0c2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="17">示例任务均为虚构内容，用于展示跨项目分配方式</text>
</svg>
